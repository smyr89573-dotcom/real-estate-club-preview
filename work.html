    <title>النادي العقاري الاستثماري — متر لكل مواطن</title>
    <link rel="icon" type="image/svg+xml" href="/real-estate-club-preview/assets/favicon-64A8cCT7.svg" />
    <script>
      // اللقطة الليلية للهيرو تبدأ تحميل قبل الجافاسكربت — في الرئيسية بس
      ;(function () {
        var base = '/real-estate-club-preview/' // '/' محليًا، '/real-estate-club-preview/' على GitHub Pages
        if (location.pathname.replace(/\/+$/, '') + '/' !== base) return
        var portrait = matchMedia('(max-aspect-ratio: 3/4)').matches
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/avif'
        l.setAttribute('fetchpriority', 'high')
        if (portrait) l.href = base + 'media/mall-night-portrait.avif'
        else {
          l.setAttribute('imagesrcset', [640, 960, 1280, 1620].map(function (w) { return base + 'media/mall-night-' + w + '.avif ' + w + 'w' }).join(', '))
          l.setAttribute('imagesizes', '100vw')
        }
        document.head.appendChild(l)
      })()
    </script>
